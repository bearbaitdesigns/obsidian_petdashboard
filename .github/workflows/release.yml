# Publishes a GitHub release for the version in manifest.json, ready for BRAT.
# Run it from the Actions tab: Release → Run workflow.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Check this version is new and listed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists. Bump the version in manifest.json and versions.json first."
            exit 1
          fi
          node -e "const v=require('./versions.json'); if(!v['$VERSION']){console.error('versions.json has no entry for $VERSION'); process.exit(1)}"

      - name: Build and check main.js matches the source
        run: |
          cp main.js main.committed.js
          sh build.sh
          if ! cmp -s main.js main.committed.js; then
            echo "::error::main.js in the repo is out of date with src/. Run ./build.sh and commit main.js."
            exit 1
          fi
          rm main.committed.js

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
